name: Suggest a dictionary term
description: Propose a term that should be added to the AI Engineer Dictionary.
title: "[New term]: "
body:
  - type: input
    id: term
    attributes:
      label: Proposed term
      placeholder: e.g. Speculative decoding
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Relevant category or field
      placeholder: e.g. LLM Engineering, Robotics, or Model Evaluation
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Suggested definition
      description: Explain the term accurately and clearly in your own words.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why does this term belong in the dictionary?
      description: Describe its relevance to AI engineering and how it differs from existing entries.
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: Supporting references or documentation
      description: Link reliable papers, books, standards, or technical documentation.
    validations:
      required: true
