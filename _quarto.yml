project:
  type: website
  output-dir: _site
  resources:
    - "notebooks/**/*.ipynb"
  render:
    - "*.qmd"
    - "dictionary/**/*.qmd"
    - "notebooks/**/*.qmd"
    - "notebooks/**/*.ipynb"
    - "vocabulary/**/*.qmd"

