    html-math-method: mathjax
    theme:
      light: cosmo
      dark: darkly
    css: assets/styles.css
    toc: true
    search: true
    code-copy: true
    code-overflow: wrap
    number-sections: false

execute:
  freeze: auto
  warning: false
  message: false
